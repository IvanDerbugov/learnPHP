<div id="modal" class="modal">
    <div class="modal-content">
        <button class="modal-content-close">X</button>
        <div class="type-btn active">
            <button id="regular-btn">Обычный</button>
            <button id="savings-btn" class="savings-btn">Сберегательный</button>
        </div>
        <form class="modal-content-form form" method="post">
            <label for="owner">Имя владельца кошелька</label>
            <input type="text" name="owner" placeholder="Имя" required>
            <label for="email">Почта</label>
            <input type="email" name="email" placeholder="Email" required>
            <label for="password">Пароль</label>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit" name="type" value="usual" id="create-btn">Создать обычный кошелёк</button>
        </form>
        <form id="login-form" class="modal-content-form form" method="post">
            <label for="login-email">Почта</label>
            <input type="email" id="login-email" name="email" placeholder="Email" required>
            <label for="login-password">Пароль</label>
            <input type="password" id="login-password" name="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
    </div>
</div>
